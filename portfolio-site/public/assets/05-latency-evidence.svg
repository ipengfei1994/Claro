<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="48" y="42" font-size="22" font-weight="700" fill="#1A1F2B">性能证据 · 完整治理流水线（本机串行基线）</text>
  <text x="48" y="64" font-size="12" fill="#5B6472">数据：docs/performance_results.json 的 pipeline 与 bulk_ingestion；n=200/档，full，单进程串行。运行条件补充自 PHASE_06_PERFORMANCE.md。</text>
  <text x="48" y="84" font-size="11" fill="#8A5A00">该 JSON 合并不同测量时间，不是单次快照；以下数字按同一 pipeline 字段展示，不与其他轮次原始日志混用。</text>

  <!-- left chart -->
  <rect x="48" y="102" width="540" height="344" rx="3" fill="#FBFCFD" stroke="#C9D0DA"/>
  <text x="66" y="126" font-size="13" font-weight="700" fill="#1F4E79">端到端延迟（ms，p50 / p95 / p99）</text>
  <text x="66" y="144" font-size="10" fill="#5B6472">ClaroProcessingService.process_message()：validate → ingest → detect → publish(Kafka) → governance</text>

  <!-- axes -->
  <line x1="92" y1="400" x2="560" y2="400" stroke="#C9D0DA"/>
  <line x1="92" y1="170" x2="92" y2="400" stroke="#C9D0DA"/>
  <g font-size="10" fill="#5B6472" text-anchor="end">
    <text x="86" y="404">0</text><text x="86" y="333">100</text><text x="86" y="262">200</text><text x="86" y="190">300</text>
  </g>
  <g stroke="#E6EAF0" stroke-width="1">
    <line x1="92" y1="328.6" x2="560" y2="328.6"/><line x1="92" y1="257.2" x2="560" y2="257.2"/><line x1="92" y1="185.8" x2="560" y2="185.8"/>
  </g>

  <!-- bars: scale 0.714 px/ms, baseline 400 -->
  <g>
    <!-- tier 1k -->
    <rect x="118" y="308.5" width="28" height="91.5" fill="#1F4E79"/>
    <rect x="152" y="264.8" width="28" height="135.2" fill="#4A7EB0"/>
    <rect x="186" y="206.1" width="28" height="193.9" fill="#9DBBD8"/>
    <text x="130" y="302" font-size="9" fill="#1A1F2B" text-anchor="middle">128</text>
    <text x="164" y="258" font-size="9" fill="#1A1F2B" text-anchor="middle">189</text>
    <text x="200" y="200" font-size="9" fill="#1A1F2B" text-anchor="middle">272</text>
    <!-- tier 10k -->
    <rect x="252" y="323.5" width="28" height="76.5" fill="#1F4E79"/>
    <rect x="286" y="293.1" width="28" height="106.9" fill="#4A7EB0"/>
    <rect x="320" y="271.8" width="28" height="128.2" fill="#9DBBD8"/>
    <text x="264" y="317" font-size="9" fill="#1A1F2B" text-anchor="middle">107</text>
    <text x="298" y="287" font-size="9" fill="#1A1F2B" text-anchor="middle">150</text>
    <text x="332" y="266" font-size="9" fill="#1A1F2B" text-anchor="middle">180</text>
    <!-- tier 50k -->
    <rect x="386" y="296.8" width="28" height="103.2" fill="#1F4E79"/>
    <rect x="420" y="246.1" width="28" height="153.9" fill="#4A7EB0"/>
    <rect x="454" y="163.2" width="28" height="236.8" fill="#9DBBD8"/>
    <text x="398" y="291" font-size="9" fill="#1A1F2B" text-anchor="middle">145</text>
    <text x="432" y="240" font-size="9" fill="#1A1F2B" text-anchor="middle">216</text>
    <text x="468" y="157" font-size="9" fill="#1A1F2B" text-anchor="middle">332</text>
  </g>
  <g font-size="11" fill="#1A1F2B" text-anchor="middle" font-weight="700">
    <text x="166" y="418">1,000 行档</text><text x="300" y="418">10,000 行档</text><text x="434" y="418">50,000 行档</text>
  </g>
  <!-- legend -->
  <g font-size="10" fill="#5B6472">
    <rect x="330" y="128" width="12" height="10" fill="#1F4E79"/><text x="348" y="137">p50</text>
    <rect x="390" y="128" width="12" height="10" fill="#4A7EB0"/><text x="408" y="137">p95</text>
    <rect x="450" y="128" width="12" height="10" fill="#9DBBD8"/><text x="468" y="137">p99</text>
  </g>
  <text x="66" y="438" font-size="10" fill="#5B6472">50,000 档 p50 比 10,000 档高约 35%；全部 600 条样本 status=processed，无 failed / duplicate。</text>

  <!-- right: stage budget -->
  <rect x="604" y="102" width="548" height="344" rx="3" fill="#FBFCFD" stroke="#C9D0DA"/>
  <text x="622" y="126" font-size="13" font-weight="700" fill="#1F4E79">阶段耗时（50,000 档，p50）</text>
  <text x="622" y="144" font-size="10" fill="#5B6472">各阶段 p50 独立上报；条长按最大阶段 90.3 ms 归一。validate 为另测值。</text>

  <g font-size="11" fill="#1A1F2B">
    <text x="622" y="180">ingest</text>
    <rect x="730" y="168" width="75" height="16" fill="#1F4E79"/><text x="815" y="181" fill="#5B6472">17.9 ms</text>
    <text x="622" y="216">detect</text>
    <rect x="730" y="204" width="124" height="16" fill="#4A7EB0"/><text x="864" y="217" fill="#5B6472">29.4 ms</text>
    <text x="622" y="252">publish</text>
    <rect x="730" y="240" width="6" height="16" fill="#9DBBD8"/><text x="746" y="253" fill="#5B6472">1.3 ms</text>
    <text x="622" y="288">governance</text>
    <rect x="730" y="276" width="380" height="16" fill="#1F4E79"/><text x="622" y="312" fill="#5B6472">90.3 ms — 政策求值、决策、案例、处置、事件、审计</text>

    <text x="622" y="348" font-weight="700">validate</text>
    <text x="730" y="348" fill="#8A5A00">0.05 ms（另测）— 流水线内是标记阶段，elapsed_ms 恒为 0</text>
    <text x="622" y="368" fill="#5B6472">--validation-only 单独测 1,000 次 RawGameMessagePayload 解析：avg 0.07 / p95 0.17 ms</text>
  </g>
  <line x1="622" y1="386" x2="1134" y2="386" stroke="#C9D0DA"/>
  <text x="622" y="406" font-size="11" fill="#1A1F2B">治理阶段 p50 为 90.3 ms：一次消息要落多张可审计表。</text>
  <text x="622" y="424" font-size="11" fill="#5B6472">阶段 p50 之和不等于端到端 p50；此处不推算占比。</text>

  <!-- bottom: throughput strip -->
  <rect x="48" y="462" width="1104" height="94" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
  <text x="66" y="486" font-size="12" font-weight="700" fill="#1F4E79">批量入库吞吐（JSON 中 bulk_ingestion，走 persist_raw_message() 真实事务路径）</text>
  <g font-size="12" fill="#1A1F2B">
    <text x="66" y="514">1,000 行 / 14.84 s</text><text x="66" y="536" font-size="16" font-weight="700" fill="#1F4E79">67.4 行/秒</text>
    <text x="400" y="514">10,000 行 / 160.21 s</text><text x="400" y="536" font-size="16" font-weight="700" fill="#1F4E79">62.4 行/秒</text>
    <text x="760" y="514">50,000 行 / 644.62 s</text><text x="760" y="536" font-size="16" font-weight="700" fill="#1F4E79">77.6 行/秒</text>
  </g>
  <text x="66" y="550" font-size="10" fill="#5B6472">这是「批量入库」，不是「批量风险检测」，也不是「完整治理流水线」；三者不可相互替代。</text>

  <text x="48" y="580" font-size="11" fill="#5B6472">纯分析 analyze_text()（n=200/档，无数据库 IO）：p50 5.12 / 5.19 / 7.52 ms。Redis 50 次同键读取 0.863 ms/次、命中 100%（不代表线上长期命中率）。</text>
  <text x="48" y="600" font-size="11" fill="#5B6472">测量不含浏览器绘制、websocket、TLS、反向代理与并发争用；是单进程串行基准，不是 QPS 上限，也不是生产环境数字。</text>
  <text x="48" y="616" font-size="10" fill="#8A5A00">注：docs/performance_results.json 是多次运行合并产物（validation_measured_at 12:53 晚于 generated_at 12:31），不是单次快照。</text>
</svg>
