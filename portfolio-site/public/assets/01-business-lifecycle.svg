<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E79"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#FFFFFF"/>
  <text x="48" y="46" font-size="22" font-weight="700" fill="#1A1F2B">Claro 业务生命周期 · 职责边界</text>
  <text x="48" y="70" font-size="12" fill="#5B6472">依据 src/claro/application/processing_service.py 与 domain/risk_engine/governance/analytics 实际模块；箭头表示数据流，不表示全部经 Kafka 异步传递。</text>

  <text x="48" y="104" font-size="11" font-weight="700" fill="#5B6472" letter-spacing="1">阶段 / 实现模块 / 持久化产出</text>
  <text x="830" y="104" font-size="11" font-weight="700" fill="#5B6472" letter-spacing="1">边界与契约</text>
  <line x1="48" y1="114" x2="1152" y2="114" stroke="#C9D0DA" stroke-width="1"/>

  <g id="stages" font-size="13">
    <!-- 1 -->
    <rect x="48" y="130" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="170" r="15" fill="#1F4E79"/>
    <text x="76" y="175" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="104" y="160" font-size="15" font-weight="700" fill="#1A1F2B">消息接入 · Message Ingestion</text>
    <text x="104" y="180" font-size="11" fill="#5B6472">application/message_events.py · repositories/kafka_repository.py · ClaroProcessingService.ingest()</text>
    <text x="104" y="197" font-size="11" fill="#1F4E79">message · inbox_event · processing_event(sequence=1) · audit_event　（单事务）</text>
    <text x="830" y="158" font-size="12" font-weight="600" fill="#1A1F2B">PostgreSQL 是唯一权威来源</text>
    <text x="830" y="178" font-size="11" fill="#5B6472">pydantic 严格校验发生在构造 payload 时；</text>
    <text x="830" y="195" font-size="11" fill="#5B6472">直接路径含 occurred_at；注释与实现不一致。</text>
    <line x1="426" y1="210" x2="426" y2="228" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 2 -->
    <rect x="48" y="230" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="270" r="15" fill="#1F4E79"/>
    <text x="76" y="275" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="104" y="260" font-size="15" font-weight="700" fill="#1A1F2B">内容预处理 · Preprocessing</text>
    <text x="104" y="280" font-size="11" fill="#5B6472">risk_engine/preprocessing.py · RiskService.detect()</text>
    <text x="104" y="297" font-size="11" fill="#1F4E79">归一化 / 变体还原 / 实体占位符 → ml_text；原文保留</text>
    <text x="830" y="258" font-size="12" font-weight="600" fill="#1A1F2B">只生成分析视图，不改写原文</text>
    <text x="830" y="278" font-size="11" fill="#5B6472">规则层与 ML 层消费不同的文本视图；</text>
    <text x="830" y="295" font-size="11" fill="#5B6472">证据链可回到原始 content。</text>
    <line x1="426" y1="310" x2="426" y2="328" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 3 -->
    <rect x="48" y="330" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="370" r="15" fill="#1F4E79"/>
    <text x="76" y="375" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="104" y="360" font-size="15" font-weight="700" fill="#1A1F2B">风险识别 · Risk Detection</text>
    <text x="104" y="380" font-size="11" fill="#5B6472">rules.py（22 条 YAML 规则） · ml/predictor.py · semantic.py（占位） · llm.py（默认关闭）</text>
    <text x="104" y="397" font-size="11" fill="#1F4E79">DetectionFinding（detector / category / score / confidence / EvidenceSpan）</text>
    <text x="830" y="358" font-size="12" font-weight="600" fill="#1A1F2B">检测器彼此独立、可降级</text>
    <text x="830" y="378" font-size="11" fill="#5B6472">语义层返回 None，不产出分数；</text>
    <text x="830" y="395" font-size="11" fill="#5B6472">LLM 仅顾问，advisory_only=true。</text>
    <line x1="426" y1="410" x2="426" y2="428" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 4 -->
    <rect x="48" y="430" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="470" r="15" fill="#1F4E79"/>
    <text x="76" y="475" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="104" y="460" font-size="15" font-weight="700" fill="#1A1F2B">风险融合 · Risk Aggregation</text>
    <text x="104" y="480" font-size="11" fill="#5B6472">risk_engine/fusion.py · config/risk_thresholds.yaml（手工调参，非统计校准）</text>
    <text x="104" y="497" font-size="11" fill="#1F4E79">risk_result · risk_finding · fusion_trace · Conflict（层间分歧）</text>
    <text x="830" y="458" font-size="12" font-weight="600" fill="#1A1F2B">只回答「多危险，为什么」</text>
    <text x="830" y="478" font-size="11" fill="#5B6472">按类别加权 noisy-OR，取最大类别分；</text>
    <text x="830" y="495" font-size="11" fill="#5B6472">缺层不重新归一化权重（与 README 一致）。</text>
    <line x1="426" y1="510" x2="426" y2="528" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 5 -->
    <rect x="48" y="530" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="570" r="15" fill="#1F4E79"/>
    <text x="76" y="575" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="104" y="560" font-size="15" font-weight="700" fill="#1A1F2B">策略裁决 · Policy Decision</text>
    <text x="104" y="580" font-size="11" fill="#5B6472">governance/policy.py · policy_service.py · governance_decision_service.py</text>
    <text x="104" y="597" font-size="11" fill="#1F4E79">policy_evaluation · policy_decision（decision_key 确定性） · policy_version</text>
    <text x="830" y="558" font-size="12" font-weight="600" fill="#1A1F2B">风险分 ≠ 处置动作</text>
    <text x="830" y="578" font-size="11" fill="#5B6472">两套阈值；限制动作或高风险低置信度</text>
    <text x="830" y="595" font-size="11" fill="#5B6472">降级为 review；策略快照哈希入幂等键。</text>
    <line x1="426" y1="610" x2="426" y2="628" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 6 -->
    <rect x="48" y="630" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="670" r="15" fill="#1F4E79"/>
    <text x="76" y="675" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="104" y="660" font-size="15" font-weight="700" fill="#1A1F2B">人工审核 · Human Review</text>
    <text x="104" y="680" font-size="11" fill="#5B6472">governance/moderation.py（CASE_TRANSITIONS） · moderation_service.py · review_case()</text>
    <text x="104" y="697" font-size="11" fill="#1F4E79">moderation_case · moderation_review（from/to status） · case_event · audit_event</text>
    <text x="830" y="658" font-size="12" font-weight="600" fill="#1A1F2B">状态机 + 行锁 + 乐观锁</text>
    <text x="830" y="678" font-size="11" fill="#5B6472">reject 解析为 allow；拦截必须显式</text>
    <text x="830" y="695" font-size="11" fill="#5B6472">override 并给 final_action / final_level。</text>
    <line x1="426" y1="710" x2="426" y2="728" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 7 -->
    <rect x="48" y="730" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="770" r="15" fill="#1F4E79"/>
    <text x="76" y="775" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="104" y="760" font-size="15" font-weight="700" fill="#1A1F2B">模拟处置 · Simulated Enforcement</text>
    <text x="104" y="780" font-size="11" fill="#5B6472">governance/enforcement.py · application/enforcement_service.py · execute_enforcement()</text>
    <text x="104" y="797" font-size="11" fill="#1F4E79">enforcement_action(simulated=true) · player_enforcement_state · outbox_event</text>
    <text x="830" y="758" font-size="12" font-weight="600" fill="#1A1F2B">不下发任何游戏服务器</text>
    <text x="830" y="778" font-size="11" fill="#5B6472">warn / block / mute / temp_ban / perm_ban；</text>
    <text x="830" y="795" font-size="11" fill="#5B6472">到期与解除各有独立记录。</text>
    <line x1="426" y1="810" x2="426" y2="828" stroke="#1F4E79" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 8 -->
    <rect x="48" y="830" width="756" height="80" rx="3" fill="#F7F9FB" stroke="#C9D0DA"/>
    <circle cx="76" cy="870" r="15" fill="#1F4E79"/>
    <text x="76" y="875" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="104" y="860" font-size="15" font-weight="700" fill="#1A1F2B">反馈分析 · Feedback &amp; Analytics</text>
    <text x="104" y="880" font-size="11" fill="#5B6472">feedback_audit_service.py · analytics/（29 条具名 SQL） · StrategyReplayService</text>
    <text x="104" y="897" font-size="11" fill="#1F4E79">governance_feedback · audit_event（追加式） · analytics_replay_run / case</text>
    <text x="830" y="858" font-size="12" font-weight="600" fill="#1A1F2B">只读历史，不修改正式决策</text>
    <text x="830" y="878" font-size="11" fill="#5B6472">KPI 单一口径 phase-05.2；分母 &lt; 30</text>
    <text x="830" y="895" font-size="11" fill="#5B6472">主动抑制比率，显示「不可计算」。</text>
  </g>

  <line x1="48" y1="920" x2="1152" y2="920" stroke="#C9D0DA" stroke-width="1"/>
  <text x="48" y="936" font-size="11" fill="#5B6472">追溯依赖消息、风险、决策、审核与处置的实体关联；trace_id 未统一覆盖所有治理记录。process_message() 实际编排为 validate → ingest → detect → publish → governance。</text>
</svg>
